# 新しい機能を追加するときに使用するIssueテンプレート。

# Issueテンプレート一覧に表示される名前。
name: 新規実装

# Issueテンプレート一覧に表示される説明。
description: 新機能や機能追加を提案する

# Issueタイトルの先頭に自動で付ける文字列。
title: "[Feature] "

# Issue作成時に自動で付けるラベル。
# GitHub側に「feature」ラベルを作成しておく。
labels:
  - feature

# Issue本文の入力フォーム。
body:

  # ------------------------------------------------------------
  # 何を作るのか
  # ------------------------------------------------------------
  - type: textarea
    id: overview

    attributes:
      label: 概要

      # 実装する機能そのものを書く。
      description: 実装する内容を記載してください。

      placeholder: |
        ロビーにキャラクター選択ボタンを追加する。

    validations:
      required: true

  # ------------------------------------------------------------
  # なぜ作るのか
  # ------------------------------------------------------------
  - type: textarea
    id: purpose

    attributes:
      label: 目的

      # 実装内容ではなく、その機能が必要な理由を書く。
      description: なぜこの機能が必要なのか記載してください。

      placeholder: |
        ロビーから使用キャラクターを変更できるようにするため。

    validations:
      required: true

  # ------------------------------------------------------------
  # 必要な仕様
  # ------------------------------------------------------------
  - type: textarea
    id: requirements

    attributes:
      label: 要件

      # 実装時に満たす必要がある仕様を書く。
      description: 必要な動作や仕様を記載してください。

      placeholder: |
        - ボタン押下でキャラクター選択画面を開く
        - マウスで操作できる
        - ゲームパッドで操作できる
        - 現在選択中のキャラクターを表示する

    validations:
      required: true

  # ------------------------------------------------------------
  # Issueを閉じてもよい条件
  # ------------------------------------------------------------
  - type: textarea
    id: completion

    attributes:
      label: 完了条件

      # 「実装したつもり」を防ぐため、
      # 何ができたらIssue完了なのか明確にする。
      description: このIssueを完了と判断できる条件を記載してください。

      placeholder: |
        - [ ] キャラクター選択画面を開ける
        - [ ] キャラクターを変更できる
        - [ ] ロビーに選択結果が反映される

    validations:
      required: true

  # ------------------------------------------------------------
  # その他の情報
  # ------------------------------------------------------------
  - type: textarea
    id: notes

    attributes:
      label: 補足

      # 仕様書、画像、参考URLなどを書く。
      description: 参考画像や関連資料などがあれば記載してください。

    validations:
      required: false