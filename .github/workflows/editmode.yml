# ============================================================
# EditMode CI
# ============================================================
#
# デフォルトブランチ向けPull Requestで、
# Unityプロジェクトのコンパイルと
# EditMode Testを確認するWorkflow。
#
# 主な目的:
#
# ・NuGetForUnity Packageの復元
# ・Unity Scriptのコンパイル確認
# ・EditMode Testの実行
#
# Build Checkより軽いため、
# PRごとに実行する。
# ============================================================

name: EditMode CI


# ============================================================
# Workflow実行条件
# ============================================================

on:

  # ----------------------------------------------------------
  # ブランチ名は固定せず、Job内でデフォルトブランチか判定。
  # ----------------------------------------------------------

  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]


  # ----------------------------------------------------------
  # GitHub Actions画面から手動実行
  # ----------------------------------------------------------

  workflow_dispatch:


# ============================================================
# 権限
# ============================================================

permissions:

  # Repositoryを読み込むため
  contents: read

  # Unity Test RunnerがCheck結果を書き込むため
  checks: write


# ============================================================
# 同じPRに新しいcommitが来た場合、
# 古いEditMode CIを停止する
# ============================================================

concurrency:

  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref
    }}

  cancel-in-progress: true


# ============================================================
# Jobs
# ============================================================

jobs:

  test-editmode:

    # PRのマージ先、または手動実行のブランチがデフォルトなら実行。
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch)
      || (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))

    name: Compile and EditMode Tests

    runs-on: ubuntu-latest

    # 異常に長時間実行されるのを防ぐ
    timeout-minutes: 30


    steps:

      # ======================================================
      # Repository取得
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:

          # 素材の全件取得を避ける。追加・更新された素材だけ
          # 後続Stepで取得する。
          lfs: false

          # PRの仮マージCommitと直前の親Commitを比較するため2世代取得。
          fetch-depth: 2


      # ======================================================
      # PRで追加・更新されたGit LFS素材のみ取得
      # ======================================================
      #
      # 特定のファイル名や拡張子に依存せず、Git差分と
      # .gitattributesのfilter=lfsを使って取得対象を決める。
      #
      # ・PR実行時: デフォルトブランチとPRの仮マージ結果の差分
      # ・手動実行時: デフォルトブランチの直近1コミットの追加・更新分
      #
      # 注意:
      # 既存の未変更LFS素材はポインタのまま残る。
      # Unityがその素材を再読み込みするとエラーになる可能性がある。
      # ======================================================

      - name: Pull added or updated LFS assets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # GitHubのPR用仮マージCommitの第1親はマージ先。
            base="$(git rev-parse 'HEAD^1')"
          elif git rev-parse 'HEAD^' >/dev/null 2>&1; then
            base="$(git rev-parse 'HEAD^')"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi

          # NUL区切りで空白などを含むファイル名にも対応。
          git diff --diff-filter=ACMRT --name-only -z "$base" HEAD > "$RUNNER_TEMP/changed-files.bin"

          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          raw = (Path(os.environ["RUNNER_TEMP"]) / "changed-files.bin").read_bytes()
          changed_files = [os.fsdecode(path) for path in raw.split(b"\0") if path]

          lfs_paths = []
          for path in changed_files:
              result = subprocess.run(
                  ["git", "check-attr", "-z", "filter", "--", path],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout.split(b"\0")
              if len(result) >= 3 and result[2] == b"lfs":
                  lfs_paths.append(path)

          if not lfs_paths:
              print("追加・更新されたGit LFS素材はありません。")
          else:
              print(f"取得するGit LFS素材: {len(lfs_paths)}件")
              for path in lfs_paths:
                  print(f"  {path}")

              # Git LFSはカンマ区切りで複数の取得パスを指定できる。
              # カンマを含む特殊なパスはこの指定方式では非対応。
              if any("," in path for path in lfs_paths):
                  raise SystemExit("Git LFSパスにカンマが含まれます。取得方法の調整が必要です。")

              subprocess.run(
                  [
                      "git", "lfs", "pull",
                      "--include=" + ",".join(lfs_paths),
                      "--exclude=",
                      "origin",
                  ],
                  check=True,
              )
          PY


      # ======================================================
      # GitHub Actions Runnerの空き容量確保
      # ======================================================
      #
      # GameCIはUnity EditorのDocker Imageを使用する。
      #
      # Unity 6のDocker Imageは非常に大きいため、
      # GitHub-hosted Runnerの初期状態では
      #
      #   no space left on device
      #
      # が発生する場合がある。
      #
      # EditMode CIで使用しないSDK等を削除して、
      # Unity Docker Imageを展開する容量を確保する。
      #
      # RunnerはJob終了後に破棄されるため、
      # Repositoryや開発者PCには影響しない。
      # ======================================================

      - name: Free disk space
        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo " Disk space before cleanup"
          echo "========================================"

          df -h


          # --------------------------------------------------
          # Android SDK / NDK
          #
          # EditMode Testでは使用しない。
          # --------------------------------------------------

          sudo rm -rf /usr/local/lib/android


          # --------------------------------------------------
          # Haskell
          # --------------------------------------------------

          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup


          # --------------------------------------------------
          # CodeQL
          # --------------------------------------------------

          sudo rm -rf /opt/hostedtoolcache/CodeQL


          # --------------------------------------------------
          # Swift
          # --------------------------------------------------

          sudo rm -rf /usr/share/swift


          # --------------------------------------------------
          # apt cache
          # --------------------------------------------------

          sudo apt-get clean


          # --------------------------------------------------
          # Runner上に未使用Dockerデータがあれば削除
          # --------------------------------------------------

          docker system prune -af || true


          echo ""
          echo "========================================"
          echo " Disk space after cleanup"
          echo "========================================"

          df -h


      # ======================================================
      # NuGetForUnity Package Restore
      # ======================================================
      #
      # R3 Coreなど、
      # NuGetForUnityで管理しているPackageを復元する。
      #
      # GitHub Actions Runnerは毎回ほぼ空の環境なので、
      # ローカルでPackageが入っていても
      # CIではrestoreが必要。
      # ======================================================

      - name: Restore NuGetForUnity packages
        shell: bash

        run: |
          set -euo pipefail

          dotnet tool install --global NuGetForUnity.Cli

          export PATH="$PATH:$HOME/.dotnet/tools"

          nugetforunity restore .


      # ======================================================
      # Unity Library Cache
      # ======================================================
      #
      # LibraryをCacheして、
      #
      # ・Asset Import
      # ・Package Import
      # ・Script Compile
      #
      # の時間を短縮する。
      #
      # 初回実行時はLibraryが存在しないため、
      # Cache Missになっても問題ない。
      #
      # もし今後また
      #
      #   no space left on device
      #
      # が出る場合は、
      # このCache Stepを削除する。
      # ======================================================

      - name: Cache Unity Library
        uses: actions/cache@v4

        with:

          path: Library

          key: >-
            Library-EditMode-${{ runner.os }}-${{
              hashFiles(
                'Assets/**',
                'Packages/manifest.json',
                'Packages/packages-lock.json',
                'Packages/nuget-packages/packages.config',
                'ProjectSettings/**'
              )
            }}

          restore-keys: |
            Library-EditMode-${{ runner.os }}-
            Library-EditMode-
            Library-


      # ======================================================
      # ゲーム側EditModeテストのAssemblyを収集
      # ======================================================
      #
      # 埋め込みURPのTestsまで実行すると、パッケージ内部の
      # 移行テスト等がゲーム用CIを落とすことがある。
      # Assets以下のTestAssembliesが有効なasmdefだけを選ぶ。
      #
      # 該当するasmdefがない場合はテスト0件で実行する。
      # Unityの起動・C#コンパイル検査は行われるが、
      # ゲーム独自のテストはまだ検証されない。
      # ======================================================

      - name: Find project EditMode test assemblies
        id: project_tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          test_assemblies = []
          for path in sorted(Path("Assets").rglob("*.asmdef")):
              definition = json.loads(path.read_text(encoding="utf-8-sig"))
              if "TestAssemblies" in definition.get("optionalUnityReferences", []):
                  name = definition.get("name")
                  if name:
                      test_assemblies.append(name)

          if test_assemblies:
              selected = ";".join(sorted(set(test_assemblies)))
              print(f"EditMode test assemblies: {selected}")
          else:
              # 存在しないAssemblyで絞り、URP内部テストの実行を避ける。
              selected = "__NoProjectEditModeTests__"
              print("::notice::ゲーム用EditModeテストAssemblyは未登録です。Unityのコンパイル確認のみ行います。")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"assembly_names={selected}", file=output)
          PY

      # ======================================================
      # EditMode Test
      # ======================================================
      #
      # Unityを起動して、
      #
      # 1. Packageを読み込む
      # 2. Scriptをコンパイルする
      # 3. EditMode Testを実行する
      #
      # ため、
      #
      # ・CSxxxx Compiler Error
      # ・asmdef参照エラー
      # ・Package依存関係エラー
      #
      # などもこの段階で検出できる。
      # ======================================================

      - name: Compile project and run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4

        env:

          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:

          githubToken: ${{ secrets.GITHUB_TOKEN }}

          testMode: editmode

          # プロジェクト側のテストAssemblyのみ実行する。
          # package内URP公式テストはゲーム用CIの対象外。
          customParameters: >-
            -assemblyNames "${{ steps.project_tests.outputs.assembly_names }}"


      # ======================================================
      # Test Result保存
      # ======================================================
      #
      # Testが失敗した場合でも、
      # 結果をGitHub ActionsのArtifactsへ保存する。
      # ======================================================

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: editmode-test-results

          path: ${{ steps.tests.outputs.artifactsPath }}