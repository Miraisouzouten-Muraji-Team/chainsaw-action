# ============================================================
# Unity Build Check
# ============================================================
#
# main向けPull Requestで、
# Unityプロジェクトが実際にビルドできるか確認する。
#
# ビルドに失敗した場合、このWorkflowも失敗する。
# ============================================================

name: Unity Build Check


# ------------------------------------------------------------
# main向けPRで実行
# ------------------------------------------------------------

on:
  pull_request:
    branches:
      - main


# ------------------------------------------------------------
# 同じPRに新しいcommitが来た場合、
# 古いBuild Checkを停止する
# ------------------------------------------------------------

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true


jobs:

  build:

    name: Windows Build

    runs-on: ubuntu-latest

    # ビルドが異常に長時間続くのを防ぐ
    timeout-minutes: 30


    steps:

      # ------------------------------------------------------
      # Repository取得
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          # FBX / WAVなどGit LFS管理のファイルも取得する
          lfs: true


      # ------------------------------------------------------
      # GitHub Actions Runnerの空き容量を確保
      # ------------------------------------------------------
      #
      # GameCIはUnity EditorのDocker Imageを取得する。
      #
      # Unity 6のImageはサイズが大きく、
      # GitHub-hosted Runnerの初期状態では
      # Docker Image展開中に
      #
      #   no space left on device
      #
      # になる場合がある。
      #
      # 今回のWindows向けUnity Buildでは使用しない
      # Android / Haskell / CodeQL / Swiftなどを削除して
      # Build前に空き容量を増やす。
      #
      # RunnerはJob終了後に破棄されるため、
      # Repositoryや開発者PCのファイルには影響しない。
      # ------------------------------------------------------

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Disk space before cleanup"
          echo "========================================"
          df -h

          # Android SDK / NDK
          sudo rm -rf /usr/local/lib/android

          # Haskell
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

          # CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Swift
          sudo rm -rf /usr/share/swift

          # apt cache
          sudo apt-get clean

          # Runnerに残っている未使用Dockerデータがあれば削除する。
          docker system prune -af || true

          echo ""
          echo "========================================"
          echo " Disk space after cleanup"
          echo "========================================"
          df -h


      # ------------------------------------------------------
      # Unity Libraryキャッシュ
      # ------------------------------------------------------
      #
      # 初回はLibraryが存在しないためCache Missになる。
      # 2回目以降に同じ内容をビルドするときの高速化用。
      # ------------------------------------------------------

      - name: Cache Unity Library
        uses: actions/cache@v4

        with:
          path: Library

          key: Library-Build-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

          restore-keys: |
            Library-Build-
            Library-


      # ------------------------------------------------------
      # Windows向けUnity Build
      # ------------------------------------------------------

      - name: Build Unity project
        uses: game-ci/unity-builder@v4

        env:

          # Repository Secretsに登録済みのUnity認証情報
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:

          # ProjectSettings/ProjectVersion.txtから
          # Unityバージョンを自動取得
          unityVersion: auto

          # Windows 64bit向けビルド
          targetPlatform: StandaloneWindows64
