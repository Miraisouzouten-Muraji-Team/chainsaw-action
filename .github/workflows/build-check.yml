# ============================================================
# Unity Build Check
# ============================================================
#
# Unityプロジェクトが実際にWindows向けに
# ビルドできるか確認するWorkflow。
#
# 重い処理なのでPRごとには実行せず、
#
# ・GitHub Actions画面から手動実行
# ・毎日 03:00 JST に自動実行
#
# とする。
# ============================================================

name: Unity Build Check


# ============================================================
# Workflow実行条件
# ============================================================

on:

  # ----------------------------------------------------------
  # GitHub Actions画面から手動実行
  # ----------------------------------------------------------

  workflow_dispatch:


  # ----------------------------------------------------------
  # 毎日 03:00 JST に自動実行
  #
  # GitHub ActionsのcronはUTC。
  #
  # 18:00 UTC
  #   ↓
  # 03:00 JST
  # ----------------------------------------------------------

  schedule:
    - cron: "0 18 * * *"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同じBranchで古いBuildが実行中の場合は停止
# ============================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  build:

    name: Windows Build

    runs-on: ubuntu-latest

    # Unity Buildは時間がかかるため少し余裕を持たせる
    timeout-minutes: 45


    steps:

      # ======================================================
      # Repository取得
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:

          # FBX / WAVなどGit LFS管理のファイルも取得
          lfs: true

          # 必要に応じてGit履歴も利用できるようにする
          fetch-depth: 0


      # ======================================================
      # Runnerの空き容量確保
      # ======================================================
      #
      # Unity 6のGameCI Docker Imageはサイズが大きいため、
      # GitHub-hosted Runnerの不要なSDK等を削除する。
      #
      # Repositoryや開発者PCには影響しない。
      # ======================================================

      - name: Free disk space
        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo " Disk space before cleanup"
          echo "========================================"
          df -h

          # Android SDK / NDK
          sudo rm -rf /usr/local/lib/android

          # Haskell
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

          # CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Swift
          sudo rm -rf /usr/share/swift

          # apt cache
          sudo apt-get clean

          # 不要なDockerデータがあれば削除
          docker system prune -af || true

          echo ""
          echo "========================================"
          echo " Disk space after cleanup"
          echo "========================================"
          df -h


      # ======================================================
      # NuGetForUnity Package Restore
      # ======================================================
      #
      # R3 Coreなど、
      # NuGetForUnityで管理しているPackageを復元する。
      #
      # ローカルPCでは既にPackageが存在していても、
      # GitHub Actions Runnerは毎回ほぼ空の環境から始まる。
      #
      # そのためBuild前にrestoreが必要。
      # ======================================================

      - name: Restore NuGetForUnity packages
        shell: bash

        run: |
          set -euo pipefail

          dotnet tool install --global NuGetForUnity.Cli

          export PATH="$PATH:$HOME/.dotnet/tools"

          nugetforunity restore .


      # ======================================================
      # Unity Library Cache
      # ======================================================
      #
      # LibraryをCacheして、
      # Asset ImportやScript Compileの時間を短縮する。
      #
      # 初回はCacheが無いため通常通り生成される。
      # ======================================================

      - name: Cache Unity Library
        uses: actions/cache@v4

        with:

          path: Library

          key: >-
            Library-Build-${{ runner.os }}-${{
              hashFiles(
                'Assets/**',
                'Packages/manifest.json',
                'Packages/packages-lock.json',
                'Packages/nuget-packages/packages.config',
                'ProjectSettings/**'
              )
            }}

          restore-keys: |
            Library-Build-${{ runner.os }}-
            Library-Build-
            Library-


      # ======================================================
      # Windows向けUnity Build
      # ======================================================

      - name: Build Unity project
        uses: game-ci/unity-builder@v4

        env:

          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:

          # ProjectSettings/ProjectVersion.txtから取得
          unityVersion: auto

          # Windows 64bit向け
          targetPlatform: StandaloneWindows64