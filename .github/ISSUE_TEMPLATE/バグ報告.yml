# GitHubで「Bug Report」のIssueを作成するためのテンプレート。
# .github/ISSUE_TEMPLATE/ 配下に配置すると、
# GitHubの「New issue」画面から選択できるようになる。

# Issueテンプレート選択画面に表示される名前。
name: バグ報告

# Issueテンプレート選択画面に表示される説明。
description: 不具合を報告する

# このテンプレートからIssueを作成した際、
# Issueタイトルの先頭に自動で付ける文字列。
title: "[Bug] "

# Issue作成時に自動で付けるラベル。
# GitHubリポジトリ側に「bug」ラベルが存在している必要がある。
labels:
  - bug

# Issue本文に表示する入力フォームを定義する。
body:

  # ------------------------------------------------------------
  # 不具合内容
  # ------------------------------------------------------------
  - type: textarea
    id: overview

    attributes:
      # 入力欄の見出し。
      label: 不具合内容

      # 入力欄の説明。
      description: 発生している問題を記載してください。

      # 入力欄に最初から薄く表示される入力例。
      placeholder: |
        キャラクター選択画面からロビーに戻ると、
        ゲームパッドでUIを操作できなくなる。

    validations:
      # trueにすると必須入力になる。
      required: true

  # ------------------------------------------------------------
  # 再現手順
  # ------------------------------------------------------------
  - type: textarea
    id: steps

    attributes:
      label: 再現手順
      description: 不具合を再現する手順を記載してください。

      placeholder: |
        1. ロビーを開く
        2. キャラクター選択画面を開く
        3. Cancelでロビーへ戻る
        4. ゲームパッドを操作する

    validations:
      required: true

  # ------------------------------------------------------------
  # 本来期待している動作
  # ------------------------------------------------------------
  - type: textarea
    id: expected

    attributes:
      label: 期待する動作
      description: 本来どのように動作するべきか記載してください。

      placeholder: |
        ロビーに戻ったあともゲームパッドでUIを操作できる。

    validations:
      required: true

  # ------------------------------------------------------------
  # 不具合が発生した環境
  # ------------------------------------------------------------
  - type: textarea
    id: environment

    attributes:
      label: 実行環境

      # Unityバージョン、OS、ブランチなどを書いてもらう。
      placeholder: |
        Unity:
        OS:
        Branch:

    validations:
      # 環境情報は必須にはしない。
      required: false

  # ------------------------------------------------------------
  # その他の情報
  # ------------------------------------------------------------
  - type: textarea
    id: notes

    attributes:
      label: 補足

      # スクリーンショット、動画、ログなどを貼る場所。
      description: スクリーンショット、動画、ログなどがあれば記載してください。

    validations:
      required: false